{{template "start" .}}
<h1>{{.Title}}</h1>
<form>
  <fieldset>
    <legend>Основные сведения</legend>
    <label>Название <input name="title" required></label>
    <label>Категория
      <select name="category" required><option value="">Выберите категорию</option><option>Учебно-научные</option><option>Продуктовые кейсы</option><option>Разработка</option></select>
    </label>
    <label>Тема <input name="topic"></label>
    <label>Краткое описание <textarea name="summary" required></textarea></label>
    <label>Полное описание <textarea name="description" required></textarea></label>
  </fieldset>
  <fieldset>
    <legend>Постановка задачи</legend>
    <label>Проблема <textarea name="problem"></textarea></label>
    <label>Актуальность <textarea name="relevance"></textarea></label>
    <label>Цель <textarea name="goal" required></textarea></label>
    <label>Целевая аудитория <input name="target_audience"></label>
    <label>Ожидаемый результат <textarea name="expected_result"></textarea></label>
    <label>Критерии успеха <textarea name="success_criteria"></textarea></label>
  </fieldset>
  <fieldset>
    <legend>Характеристики</legend>
    <label>Сложность <select name="difficulty"><option>Начальная</option><option>Средняя</option><option>Продвинутая</option><option>Экспертная</option></select></label>
    <label>Срок от, дней <input name="estimated_days_min" type="number" min="1"></label>
    <label>Срок до, дней <input name="estimated_days_max" type="number" min="1"></label>
    <label>Навыки <input name="skills"></label>
    <label>Технологии <input name="technologies"></label>
    <label>Ресурсы <textarea name="resources"></textarea></label>
    <label>Этапы <textarea name="stages"></textarea></label>
  </fieldset>
  <fieldset>
    <legend>Публикация</legend>
    <label>Теги <input name="tags"></label>
    <label>Ссылка на обложку <input name="cover_url" type="url"></label>
    <label>Ссылка на источник <input name="source_url" type="url"></label>
    <label><input name="team_available" type="checkbox"> Доступен поиск команды</label>
    <label><input name="accepts_solutions" type="checkbox"> Принимать решения</label>
  </fieldset>
  <fieldset>
    <legend>Проверка</legend>
    <p>Предварительный просмотр, предупреждения о полях и похожих проектах.</p>
    <div class="links">
      <a href="/projects/project-draft-1/preview">Предпросмотр</a>
      <button type="button" disabled>Сохранить черновик</button>
      <button type="button" disabled>Отправить на публикацию</button>
    </div>
  </fieldset>
</form>
{{template "end" .}}
